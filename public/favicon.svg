<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <!-- Text/A Symbol Gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <!-- Subtle drop shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Glow Background -->
  <circle cx="256" cy="256" r="230" fill="url(#glow)" />
  
  <!-- Outer Rounded Border Ring -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="#080a11" stroke="url(#grad)" stroke-width="16" filter="url(#shadow)" />
  
  <!-- Center Styled 'A' Symbol -->
  <!-- A futuristic geometric path for the letter A -->
  <path d="M256 100 L380 380 H320 L256 230 L192 380 H132 Z" fill="url(#grad)" />
  <path d="M256 195 L296 290 H216 Z" fill="#080a11" />
  
  <!-- Small glowing dot for tech accent -->
  <circle cx="370" cy="370" r="20" fill="#34d399" filter="url(#shadow)" />
</svg>